<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="相声宇宙失物招领：未认领移动终端">
  <title>失物招领｜未认领移动终端</title>
  <link rel="stylesheet" href="../assets/css/phone.css?v=20260911-1">
  <script src="../assets/js/phone.js?v=20260911-2" defer></script>
</head>
<body class="phone-page">
  <div class="lost-topbar">
    <a href="../index.html">← 返回公共信息门户</a>
    <span>失物招领 / 未认领设备</span>
  </div>

  <main class="lost-main">
    <section class="lost-copy" aria-labelledby="lost-title">
      <p class="eyebrow">LOST & FOUND / DEVICE 001</p>
      <h1 id="lost-title">未认领移动终端</h1>
      <p>设备处于锁定状态。暂未登记设备内部信息。</p>
      <div class="lost-record">
        <div>物品类型：移动终端</div>
        <div>当前状态：待认领</div>
        <div>备注：设备可正常点亮，需输入锁屏密码。</div>
      </div>
    </section>

    <section class="phone-shell" aria-label="未认领手机">
      <div class="phone-screen">
        <div class="lock-screen" data-lock-screen>
          <div class="phone-status">
            <span data-phone-time>--:--</span>
            <span class="status-icons" aria-hidden="true">● ◒ ▰</span>
          </div>

          <div class="lock-time" data-phone-time>--:--</div>
          <div class="lock-date" data-phone-date>日期载入中</div>

          <div class="unlock-panel">
            <p class="unlock-title">请输入密码</p>
            <div class="pin-dots" aria-label="六位密码输入状态">
              <span class="pin-dot" data-pin-dot></span>
              <span class="pin-dot" data-pin-dot></span>
              <span class="pin-dot" data-pin-dot></span>
              <span class="pin-dot" data-pin-dot></span>
              <span class="pin-dot" data-pin-dot></span>
              <span class="pin-dot" data-pin-dot></span>
            </div>
            <p class="error-text" data-error-text aria-live="polite"></p>

            <div class="hints" data-hints aria-live="polite"></div>

            <div class="keypad" aria-label="数字键盘">
              <button class="key" type="button" data-key="1">1</button>
              <button class="key" type="button" data-key="2">2</button>
              <button class="key" type="button" data-key="3">3</button>
              <button class="key" type="button" data-key="4">4</button>
              <button class="key" type="button" data-key="5">5</button>
              <button class="key" type="button" data-key="6">6</button>
              <button class="key" type="button" data-key="7">7</button>
              <button class="key" type="button" data-key="8">8</button>
              <button class="key" type="button" data-key="9">9</button>
              <span class="key key-empty" aria-hidden="true"></span>
              <button class="key" type="button" data-key="0">0</button>
              <button class="key key-action" type="button" data-key="backspace" aria-label="删除">删除</button>
            </div>
          </div>
        </div>

        <div class="home-screen" data-home-screen hidden>
          <div class="phone-status">
            <span data-phone-time>--:--</span>
            <span class="status-icons" aria-hidden="true">● ◒ ▰</span>
          </div>
          <div class="home-placeholder">
            <strong>设备已解锁</strong>
            <p>手机内部内容尚未整理。</p>
          </div>
          <div class="home-bar" aria-hidden="true"></div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
